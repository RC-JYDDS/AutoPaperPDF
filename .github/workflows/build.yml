name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build unsigned application
        id: build
        run: ./scripts/build.ps1

      - name: Run core and margin checks
        run: ./scripts/test.ps1

      - name: Upload unsigned build
        uses: actions/upload-artifact@v7
        with:
          name: AutoPaperPDF-${{ steps.build.outputs.version }}-unsigned
          path: dist/unsigned/AutoPaperPDF.exe
          if-no-files-found: error
          retention-days: 14
